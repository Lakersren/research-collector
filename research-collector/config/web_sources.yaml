      SSR 渲染，列表页 `<a>` 标签抽到 12 条。sitemap 只有列表页本身。
      文章页 trafilatura 实测 11,000~23,600 字符（英文），日期正确。
      ⚠️ net_helper 白名单把 minimax.io 误判为境外站，走 overseas_get。
