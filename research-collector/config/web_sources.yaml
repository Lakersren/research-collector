# A-RIS 境外 web 源配置表（第二批：Substack + 实验室/媒体 RSS）
#
# 🔴 为什么用配置表而不是每站一个采集器
# ------------------------------------------------------------------
# 2026-08-24 实测：六个 Substack 站与 SemiAnalysis 的 Substack 侧**完全同构**
# （`/api/v1/archive` + `/api/v1/posts/<slug>`，字段名逐一对齐），
# 图片 URL 也都是同一套 `substackcdn.com/image/fetch/$s_!xx!,w_1456,…` 包装。
# ⇒ 差异只有 host / 名字 / 起始日期。写六份采集器等于把同一个 bug 复制六遍。
#
# RSS 侧不同构（七个站七种 HTML），但 `trafilatura 2.0.0`（本机已装）实测
# 7/7 能拿到正文 + 标题 + 作者 + 图片，零导航噪声 ⇒ 也不需要每站写解析器。
#
# 🔴 `since` 的意义：控制**回灌起点**，不是过滤器
# ------------------------------------------------------------------
# thezvi 1,217 篇最早到 2011-03、aisupremacy 1,004 篇最早 2021-06。
# 全量回灌 3,229 篇正文 ≈ 22 分钟请求 + 数千张图，而 2022 年的 AI 评论
# 对当下算力叙事的边际价值极低。
# ⚠️ 但这**不是**丢数据：改 since 重跑 `--full` 就会把更早的补上（原始 JSON
# 按 slug 一文件，天然幂等）。默认值按「这个站什么时候开始讲当下这轮算力」定，
# 不是一刀切。

substack:
  # 判据：archive 全量翻页（offset 按实际返回条数累加，首页只回 23 条）
  # audience: everyone=完整全文 / only_paid=预览或无正文
  # 数字是 2026-08-24 15:10 实测全量，不是估计
  - key: web:interconnects
    name: Interconnects
    host: https://www.interconnects.ai
    since: '2024-01-01'
    author_hint: Nathan Lambert
    note: >-
      369 篇（everyone 328 / only_paid 41），2020-06 起，含 86 篇 podcast。
      偏免费，后训练/RLHF/开源模型评测第一手。img 1.4/篇。
  - key: web:thechipletter
    name: The Chip Letter
    host: https://thechipletter.substack.com
    since: '2024-01-01'
    author_hint: Babbage
    note: >-
      199 篇（117/82），2022-08 起。半导体史与架构，图多（3.8/篇，最多 12）。
  - key: web:importai
    name: Import AI
    host: https://importai.substack.com
    since: '2024-01-01'
    author_hint: Jack Clark
    note: >-
      152 篇，**全部 everyone**（零付费墙）。Anthropic 联创周报，
      正文中位 16.8k 字符、零图 ⇒ 纯文本高密度，检索价值高、存储成本低。
  - key: web:thezvi
    name: Don't Worry About the Vase
    host: https://thezvi.substack.com
    since: '2025-01-01'
    author_hint: Zvi Mowshowitz
    note: >-
      1,217 篇，**全部 everyone**，最早 2011-03。正文中位 46.6k 字符（六站最长）。
      🔴 since 定在 2025 而非 2024：它是 AI 安全/政策评论为主，
      与股票投研的相关性低于其他五站，先只收近一年看实际引用率再决定要不要往前扩。
  - key: web:fabricatedknowledge
    name: Fabricated Knowledge
    host: https://www.fabricatedknowledge.com
    since: '2024-01-01'
    author_hint: Doug O'Laughlin
    note: >-
      288 篇（everyone 80 / only_paid 208），2019-11 起。半导体投资视角，
      与正安的工作最贴近。免费篇正文可达 42.9k 字符。
      🔴 **付费篇 `body_html` 直接缺失**（实测 `the-cost-of-time-and-ai-timelines`：
      has_body_html=false、chars=0，而 wordcount=1205）⇒ 与 SemiAnalysis 不同，
      它的付费篇不给预览。入库必须是 no_text，**不能标成 preview**
      （preview 意味着「有一部分可读」，标错会让人以为能读）。
  - key: web:aisupremacy
    name: AI Supremacy
    host: https://www.ai-supremacy.com
    since: '2025-01-01'
    author_hint: Michael Spencer
    note: >-
      1,004 篇（everyone 85 / only_paid 919），重付费。付费篇给短预览
      （实测 2,523 字符 vs wordcount 1137）。
      🔴 since 定 2025：付费率 92%，免费篇才 85 篇，回灌全量性价比最低。
  - key: web:epochai
    name: Epoch AI (Substack)
    host: https://epochai.substack.com
    since: '2024-12-01'
    author_hint: Epoch AI
    note: >-
      139 篇，**audience 全部 everyone（零付费墙）**，最早 2024-12-06。
      wordcount 中位 1,593、最大 15,018；正文实测 body_html 15,047 字符。
      🔴 **它与官网不是彼此的超集，两边都要接**（标题归一化比对）：
      139 篇里只有 51 篇能在官网 gradient-updates 找到；
      substack 独有的多是 **Epoch Brief 摘要型（10 篇）** 与外部 restack。
      ⇒ 只接这里会丢掉官网 publications 74 / data-insights 88 的全部深度内容；
      只接官网会丢掉这 88 篇差集。官网侧走 `collectors/epoch_site.py`。
      since 定 2024-12：就是它的开站时间，全量也就 139 篇，无需裁剪。

