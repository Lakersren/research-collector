      文章页 trafilatura 实测 1,700~2,800 字符（中文），日期正确。
      ⚠️ content-type 无 charset，requests 默认 ISO-8859-1 会乱码，
      但采集器 `fetch_text` 用 `content.decode("utf-8")` 不受影响。
