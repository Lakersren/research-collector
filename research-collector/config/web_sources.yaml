  - key: web:servethehome
    name: ServeTheHome
    feed: https://www.servethehome.com/feed/
    full_in_feed: false
    note: >-
      6 条（滚动窗口很短，不能停久）。description 454 字符，文章页 8,546 字符。
      Hot Chips 级硬件实测（实例：d-Matrix Raptor 3D-DRAM 推理加速卡）——
