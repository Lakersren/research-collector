  - key: web:damodaran
    name: Musings on Markets (Damodaran)
    feed: http://aswathdamodaran.blogspot.com/feeds/posts/default
    full_in_feed: true
    note: >-
      23 条（Atom），`<content>` **90,975 字符全文** ⇒ 零额外请求。
      估值方法论一手 —— 十二个境外源里唯一站在 **PM 视角**而非技术/媒体视角的。
      ⚠️ http 而非 https：blogspot 的 feeds 端点实测这个形式可用，别“顺手修正”。

# ══════════════════════════════════════════════════════════════════
# standalone —— 非配置表驱动的采集器，仅在此登记以便图片下载器认识它们
# 🔴 为什么必须登记（2026-08-25 实测）：
#    `web_media_dl.py` 是配置表驱动的，只读 substack:/rss: 两段。
#    epoch_site 走自己的清单机制，不属于任一段 ⇒ 首轮回灌后
#    **721 处图锚点、本地 0 张**，而采集日志一切正常（226 篇 ready、零失败）。
#    又一个静默失败：不看「我原本设计的那条路走通了吗」就发现不了。
# ⚠️ 这里只需 key —— 采集参数在各自的采集器里，不在这。
#    多写字段会被 web_media_dl 忽略（它不做未知字段校验），
#    所以别把 feed/host 抄过来假装配置在这里生效。
# ══════════════════════════════════════════════════════════════════
standalone:
  - key: web:epoch_site
    name: Epoch AI (官网)
    collector: collectors/epoch_site.py
    host: https://epoch.ai
    note: >-
      清单来自列表页结构化 JSON（226 篇：publications 73 / data-insights 87 /
      gradient-updates 66）。日期取清单，**不用 trafilatura**
      —— 实测 147/222 篇它抽错，最狠的差 9,178 天（2022 年文章抽成 1996-12-04）。
