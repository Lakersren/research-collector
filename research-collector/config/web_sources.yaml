  - key: web:deepmind
    name: Google DeepMind Blog
    feed: https://deepmind.google/blog/rss.xml
    full_in_feed: false
    note: >-
      100 条/次。feed 的 description 只有 81 字符（**不是全文**），
      必须抓文章页；trafilatura 实测 9,785 字符、作者/日期齐全。
  - key: web:googleresearch
    name: Google Research Blog
    feed: https://research.google/blog/rss/
    full_in_feed: false
    note: >-
      100 条/次。feed description 仅 13 字符。trafilatura 8,925 字符。
      🔴 **日期必须用 RSS 的 pubDate，不能用 trafilatura 抽的**：实测同一篇
      trafilatura 给 2026-08-11、RSS 给 08-21、正文头写 August 21 ⇒ 它抽错了。
  - key: web:nvidia_news
    name: NVIDIA Blog
