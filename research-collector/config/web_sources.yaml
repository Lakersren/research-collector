  # ══════════════════════════════════════════════════════════════
  # 第三批（2026-08-25）—— 补实验室与硬件层
  # 判据一律是「它给的是新事实，还是同一事实的第 N 个副本」。
  # 下面每个数字都是 2026-08-25 00:30 前后实测，不是估算。
  # ══════════════════════════════════════════════════════════════
  - key: web:openai
    name: OpenAI News
    feed: https://openai.com/news/rss.xml
    full_in_feed: false
    trailing_slash: true
    browser_headers: true
    note: >-
      🥇 **1,143 条全量历史**（回溯到 2015-12）—— 与其他 RSS 站的滚动窗口
      完全不同，一次抓全。实测 `<item>`/`</item>`/`pubDate` 三个计数均为 1143，
      排除了正则多匹的可能。feed 的 description 仅 143~160 字符 ⇒ 必须抓页面。
      🔴 **两个开关都不可删**，删任一个都是全量 403：
        · `trailing_slash`：RSS 里 link 无尾斜杠，不补直接 403；
        · `browser_headers`：它校 `Sec-Fetch-Dest/Mode/Site`，
          二分实测证实与 UA 无关（换两种 UA 都 403，加 Sec-Fetch 就 200）。
      补齐后 trafilatura 得 10,153 字符、date 正确。
      现有实验室层有 DeepMind/Anthropic/GoogleResearch/NVIDIA，**唯独缺 OpenAI 本尊**。
  - key: web:qwen
    name: Qwen Blog
    feed: https://qwenlm.github.io/blog/index.xml
    full_in_feed: false
    note: >-
      44 条（Atom）。feed 的 description 仅 747 字符，文章页 trafilatura 实测
      12,799 字符。国产模型一手口径，做中美能力对比时是唯一权威源。
  - key: web:deepseek
    name: DeepSeek News
    feed: https://www.deepseek.com/news
    kind: html_list
    full_in_feed: false
    note: >-
